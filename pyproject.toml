[project]
name = "rivalmap"
version = "0.1.0"
description = "Standalone competitive-intelligence capability extracted from MarketCompass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
  "strands-agents>=1.53.0,<2.0.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
  "live: optional network integration requiring Bedrock and Exa credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["rivalmap*"]
